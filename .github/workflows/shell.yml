name: Shell Checks

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash -n
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n 1 bash -n
      - name: shellcheck
        # 警告/情報（SC2034 など、source される変数の誤検知を含む）ではなく
        # 実エラーのみで失敗させる。構文エラーは上の `bash -n` でも捕捉している。
        run: find . -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
